# Junction: on every push to main, run the browser test suite, then deploy hosting.
# Rules and functions are deployed by hand: firebase deploy --only firestore,functions --project junction-rm
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install test tools
        run: cd tests && npm install
      - name: Syntax
        run: node --check game.js && node --check sw.js && cp online.js /tmp/online.mjs && node --check /tmp/online.mjs
      - name: Browser tests
        run: cd tests && npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: tests/shots, if-no-files-found: ignore }
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JUNCTION_RM }}
          channelId: live
          projectId: junction-rm
